name: Checks

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 16 * * 1'  # Every Monday at 16:41 UTC, to catch breakage from new Rust releases.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --all-features

  code-quality:
    name: Code quality (pre-commit hooks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      # The tests job already runs cargo test, on every OS.
      - name: Run pre-commit hooks
        run: uvx pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: cargo-test
